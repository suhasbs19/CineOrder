name: CineOrder Continuous Announcement Monitor

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Workflow-level concurrency protection to prevent simultaneous monitor runs
concurrency:
  group: cineorder-announcement-monitoring
  cancel-in-progress: false

jobs:
  monitor-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Previous Monitor State & Proposals Cache
        uses: actions/cache/restore@v4
        id: restore-monitor-cache
        with:
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          key: cineorder-monitor-state-${{ github.run_id }}
          restore-keys: |
            cineorder-monitor-state-

      - name: Run Global Continuous Announcement Monitor
        run: npm run monitor:once

      - name: Save Updated Monitor State & Proposals Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          key: cineorder-monitor-state-${{ github.run_id }}

      - name: Archive Monitor Telemetry & Staged Proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cineorder-announcements-state
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          retention-days: 30

      - name: Verify Dataset & Release Gates
        run: |
          npm run validate
          npm run release:gate
