name: CineOrder Continuous Announcement Monitor

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Workflow-level concurrency protection to prevent simultaneous monitor runs
concurrency:
  group: cineorder-announcement-monitoring
  cancel-in-progress: false

jobs:
  monitor-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Previous Monitor State & Proposals Cache
        uses: actions/cache/restore@v4
        id: restore-monitor-cache
        with:
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          key: cineorder-monitor-state-${{ github.run_id }}
          restore-keys: |
            cineorder-monitor-state-

      - name: Run Global Continuous Announcement Monitor
        run: npm run monitor:once

      - name: Verify Persistent Monitor State
        shell: bash
        run: |
          echo "=== PERSISTENCE VERIFICATION ==="
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          ls -la "$GITHUB_WORKSPACE"

          STATE="$GITHUB_WORKSPACE/.cineorder_monitor_state.json"
          PROPOSALS="$GITHUB_WORKSPACE/.cineorder_announcement_proposals.json"

          echo "STATE=$STATE"
          echo "PROPOSALS=$PROPOSALS"

          if [ ! -f "$STATE" ]; then
            echo "ERROR: STATE FILE DOES NOT EXIST"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*cineorder*" -print
            exit 1
          fi

          if [ ! -f "$PROPOSALS" ]; then
            echo "ERROR: PROPOSAL FILE DOES NOT EXIST"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*cineorder*" -print
            exit 1
          fi

          test -s "$STATE"
          test -s "$PROPOSALS"

          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$STATE"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$PROPOSALS"

          echo "STATE FILE: EXISTS"
          echo "PROPOSAL FILE: EXISTS"
          echo "JSON VALIDATION: PASS"
          echo "PERSISTENCE VERIFICATION: PASS"

      - name: Save Updated Monitor State & Proposals Cache
        uses: actions/cache/save@v4
        with:
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          key: cineorder-monitor-state-${{ github.run_id }}

      - name: Archive Monitor Telemetry & Staged Proposals
        uses: actions/upload-artifact@v4
        with:
          name: cineorder-announcements-state
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Verify Dataset & Release Gates
        run: |
          npm run validate
          npm run release:gate
