name: CineOrder Continuous Announcement Monitor

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Workflow-level concurrency protection to prevent simultaneous monitor runs
concurrency:
  group: cineorder-announcement-monitoring
  cancel-in-progress: false

jobs:
  monitor-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Previous Monitor State & Proposals Cache
        uses: actions/cache/restore@v4
        id: restore-monitor-cache
        with:
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          key: cineorder-monitor-state-${{ github.run_id }}
          restore-keys: |
            cineorder-monitor-state-

      - name: Run Global Continuous Announcement Monitor
        run: npm run monitor:once

      - name: Verify Persistent Monitor State
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const statePath = path.resolve(workspace, ".cineorder_monitor_state.json");
            const propPath = path.resolve(workspace, ".cineorder_announcement_proposals.json");

            console.log("\nPersistence Verification");
            console.log("------------------------");
            console.log("Workspace: " + workspace);

            if (!fs.existsSync(statePath)) {
              console.error("❌ State file NOT found at: " + statePath);
              process.exit(1);
            }
            const stateSize = fs.statSync(statePath).size;
            let stateData;
            try {
              stateData = JSON.parse(fs.readFileSync(statePath, "utf-8"));
            } catch (err) {
              console.error("❌ State file contains invalid JSON:", err);
              process.exit(1);
            }
            console.log("\nState:\nEXISTS\nSize: " + stateSize + " bytes\nValid JSON: YES");

            if (!fs.existsSync(propPath)) {
              console.error("❌ Proposals file NOT found at: " + propPath);
              process.exit(1);
            }
            const propSize = fs.statSync(propPath).size;
            let propData;
            try {
              propData = JSON.parse(fs.readFileSync(propPath, "utf-8"));
            } catch (err) {
              console.error("❌ Proposals file contains invalid JSON:", err);
              process.exit(1);
            }
            console.log("\nProposals:\nEXISTS\nSize: " + propSize + " bytes\nValid JSON: YES\nProposal count: " + (Array.isArray(propData) ? propData.length : 0));
            console.log("\nEvent hashes:\n" + (stateData.eventHashes ? stateData.eventHashes.length : 0));
            console.log("\nPERSISTENCE VERIFICATION: PASS\n");
          '

      - name: Save Updated Monitor State & Proposals Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          key: cineorder-monitor-state-${{ github.run_id }}

      - name: Archive Monitor Telemetry & Staged Proposals
        uses: actions/upload-artifact@v4
        with:
          name: cineorder-announcements-state
          path: |
            .cineorder_monitor_state.json
            .cineorder_announcement_proposals.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify Dataset & Release Gates
        run: |
          npm run validate
          npm run release:gate
